version: 1
product_id: jar181-canary
display_name: JAR-181 Canary
repo: Pluetonical/jar181-canary
ref: main
public_path: /workloads/jar181-canary
services:
  - name: web
    build: .
    dockerfile: Dockerfile
    command: ["python", "/app/app.py"]
    port: 8080
    public: true
    health_path: /health
    resources:
      cpus: 0.10
      memory_mb: 64
      pids: 32
checks:
  - name: image starts
    service: web
    command: ["python", "-c", "print('ok')"]
    timeout_seconds: 60
rollback_releases: 3
